name: open-chess-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: openchesslab
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chess -d openchesslab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/openchesslab
      DIRECT_URL: postgresql://chess:chess@postgres:5432/openchesslab
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      FAIR_PLAY_ENABLED: ${FAIR_PLAY_ENABLED:-true}
      FAIR_PLAY_DEPTH: ${FAIR_PLAY_DEPTH:-12}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Open Chess Lab <no-reply@localhost>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: web
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
